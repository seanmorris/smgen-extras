name: Publish package

on:
  push:
    tags:
      - smgen-data-pages-v*
      - smgen-store-v*
      - smgen-phpdoc-v*
      - smgen-jsdoc-v*
      - smgen-categories-v*
      - smgen-timeline-v*
      - smgen-theme-*-v*
      - create-smgen-site-v*

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workspace
        uses: actions/checkout@v4

      - name: Check out SMGen
        uses: actions/checkout@v4
        with:
          repository: seanmorris/smgen
          path: _smgen

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, yaml
          coverage: none

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        env:
          SMGEN_BIN: ${{ github.workspace }}/_smgen/smgen.sh
        run: npm run check

      - name: Select tagged workspace
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^([a-z0-9-]+)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "Unsupported release tag: ${tag}" >&2
            exit 1
          fi
          package="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          directory=""
          for candidate in plugins/*/ themes/*/; do
            candidate="${candidate%/}"
            [[ -f "${candidate}/package.json" ]] || continue
            if [[ "$(node -p "require('./${candidate}/package.json').name")" == "${package}" ]]; then
              directory="${candidate}"
              break
            fi
          done
          if [[ -z "${directory}" ]]; then
            echo "Tag ${tag} names no workspace package: ${package}" >&2
            exit 1
          fi
          declared="$(node -p "require('./${directory}/package.json').version")"
          if [[ "${declared}" != "${version}" ]]; then
            echo "Tag ${tag} does not match ${package} version ${declared}." >&2
            exit 1
          fi
          echo "name=${package}" >> "${GITHUB_OUTPUT}"
          echo "directory=${directory}" >> "${GITHUB_OUTPUT}"

      - name: Publish tagged workspace
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace "${{ steps.package.outputs.directory }}" --access public --provenance
