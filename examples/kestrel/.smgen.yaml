PRODUCT_NAME: Kestrel
TITLE_PREFIX: Kestrel
TAGLINE: Backups you can read
ORGANIZATION: Kestrel

# The example owns only its pages. Template, styles, fonts and scripts come
# from the docs theme so the demo can never drift from what users get.
BASE_URL: http://localhost:8200/examples/kestrel
OUTPUT_DIR: ../../static/examples/kestrel
PAGES_DIR: ./pages
TEMPLATE_DIR: ../../themes/docs/templates
STATIC_DIR: ../../themes/docs/static
DEFAULT_THEME: theme-docs
SMGEN_ENGINE: php
SEARCH_ENABLED: auto
INHERIT_CORE_STATIC: 0
HIGHLIGHT_STYLE: kate
DOCS_VERSION: v2.4.0
DOCS_REPOSITORY: https://github.com/seanmorris/smgen-extras/tree/main/examples/kestrel
CORE_ASSETS:
  - main.js
  - nav-state.js
  - scrollbar.css
  - search.js
SCRIPTS:
  - /theme.js
  - /nav-state.js
DEFER_SCRIPTS:
  - /main.js
  - /search.js
STYLES:
  - /scrollbar.css
  - /docs.css
MENUS:
  docs:
    label: Contents
    renderer: tree
    hierarchy: source
    showLabel: false
MENU_REGIONS:
  sidebar: [docs]
