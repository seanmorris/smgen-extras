PRODUCT_NAME: Field Notes
TAGLINE: A journal from the harbour studio
TITLE_PREFIX: Field Notes
DEFAULT_THEME: theme-journal
BASE_URL: http://localhost:8200/examples/blog
OUTPUT_DIR: ../../static/examples/blog
PAGES_DIR: ./pages
TEMPLATE_DIR: ./templates
STATIC_DIR: ./static
STYLES: [/scrollbar.css, /journal.css]
CORE_ASSETS:
  - main.js
  - nav-state.js
  - scrollbar.css
SCRIPTS:
  - /theme.js
  - /nav-state.js
DEFER_SCRIPTS:
  - /main.js
SEARCH_ENABLED: 0
SMGEN_ENGINE: php
PLUGINS:
  - use: smgen-categories
    options:
      config: .smgen-categories.yaml
    watch:
      - .smgen-categories.yaml
      - templates
  - use: smgen-timeline
    options:
      template: templates/day.md.php
    watch:
      - templates
MENUS:
  archive:
    label: Archive
    renderer: timeline
    showLabel: true
MENU_REGIONS:
  sidebar: [archive]
RSS_FEEDS:
  notes:
    path: /feed.xml
    title: Field Notes
    description: Notes, walks, and ink recipes from a small print and design studio on the harbour.
    link: /
    language: en-gb
    limit: 20
    channel:
      copyright: Copyright 2026 Field Notes
      category:
        - Printing
        - Design
