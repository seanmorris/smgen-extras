PRODUCT_NAME: PHPDoc Example
TAGLINE: Static API reference
TITLE_PREFIX: smgen-phpdoc example
DEFAULT_THEME: theme-phpdoc
BASE_URL: http://localhost:8200/examples/phpdoc
OUTPUT_DIR: ../../static/examples/phpdoc
PAGES_DIR: ./pages
TEMPLATE_DIR: ../shared/templates
STATIC_DIR: ../shared/static
STYLES: [/example.css]
SEARCH_ENABLED: 0
SMGEN_ENGINE: php
PLUGINS:
  - use: smgen-phpdoc
    options:
      config: .smgen-phpdoc.yaml
MENUS:
  reference:
    label: Reference
    renderer: tree
    hierarchy: manual
    showLabel: true
    links:
      - id: overview
        page: index.md
        title: Overview
        weight: -100
      - id: api-reference
        group: true
        title: Greeting API
        weight: 10
        expanded: true
MENU_REGIONS:
  sidebar: [reference]
