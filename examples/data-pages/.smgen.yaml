PRODUCT_NAME: Greywater Range
TAGLINE: Trail guide
TITLE_PREFIX: Greywater Range
DEFAULT_THEME: theme-guide
BASE_URL: http://localhost:8200/examples/data-pages
OUTPUT_DIR: ../../static/examples/data-pages
PAGES_DIR: ./pages
TEMPLATE_DIR: ./templates
STATIC_DIR: ./static
STYLES: [/scrollbar.css, /guide.css]
CORE_ASSETS:
  - main.js
  - nav-state.js
  - scrollbar.css
SCRIPTS:
  - /theme.js
  - /nav-state.js
DEFER_SCRIPTS:
  - /main.js
SEARCH_ENABLED: 0
SMGEN_ENGINE: php
PLUGINS:
  - use: smgen-data-pages
    options:
      config: .smgen-data-pages.yaml
    watch:
      - .smgen-data-pages.yaml
      - data
      - templates
MENUS:
  guide:
    label: Guide
    renderer: tree
    hierarchy: manual
    showLabel: false
    links:
      - id: trails
        group: true
        title: Trails
        weight: 10
        expanded: true
      - id: region-north-fork
        group: true
        parent: trails
        title: North Fork
        weight: 10
        expanded: true
      - id: region-saddle-ridge
        group: true
        parent: trails
        title: Saddle Ridge
        weight: 20
        expanded: true
      - id: region-lower-basin
        group: true
        parent: trails
        title: Lower Basin
        weight: 30
        expanded: true
      - id: region-coastal-bluffs
        group: true
        parent: trails
        title: Coastal Bluffs
        weight: 40
        expanded: true
      - id: campgrounds
        group: true
        title: Campgrounds
        weight: 20
        expanded: true
      - id: about
        page: about.md
        title: About this guide
        weight: 100
MENU_REGIONS:
  sidebar: [guide]
