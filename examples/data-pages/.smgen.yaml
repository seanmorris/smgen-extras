PRODUCT_NAME: Data Pages Example
TAGLINE: Two directories generated from CSV
TITLE_PREFIX: smgen-data-pages example
BASE_URL: http://localhost:8200/examples/data-pages
OUTPUT_DIR: ../../static/examples/data-pages
PAGES_DIR: ./pages
TEMPLATE_DIR: ../shared/templates
STATIC_DIR: ../shared/static
STYLES: [/example.css]
SEARCH_ENABLED: 0
SMGEN_ENGINE: php
PLUGINS:
  - use: smgen-data-pages
    options:
      config: .smgen-data-pages.yaml
    watch:
      - .smgen-data-pages.yaml
      - data
      - templates
MENUS:
  directory:
    label: Directory
    renderer: tree
    hierarchy: manual
    showLabel: true
    links:
      - id: overview
        page: index.md
        title: Overview
        weight: -100
      - id: customer-records
        group: true
        title: Customers
        weight: 10
        expanded: true
      - id: organization-records
        group: true
        title: Organizations
        weight: 20
        expanded: true
MENU_REGIONS:
  sidebar: [directory]
