version: 1
datasets:
  trails:
    source: data/trails.csv
    template: templates/trail.md.php
    output: trails/{slug}.md
    key: slug
    columns:
      slug: Slug
      name: Name
      region: Region
      distance_km: Distance Km
      gain_m: Elevation Gain M
      route_type: Route Type
      difficulty: Difficulty
      hours: Time Hours
      dogs: Dogs
      trailhead: Trailhead
      season: Season
      summary: Summary
      highlights: Highlights
      description: Description
    required: [slug, name, region, distance_km, gain_m, route_type, difficulty, hours, dogs, trailhead, season, summary, highlights, description]
    collections:
      - template: templates/home.md.php
        output: index.md
      - template: templates/trails.md.php
        output: trails/index.md
  campgrounds:
    source: data/campgrounds.csv
    template: templates/campground.md.php
    output: campgrounds/{slug}.md
    key: slug
    columns:
      slug: Slug
      name: Name
      region: Region
      sites: Sites
      elevation_m: Elevation M
      reservations: Reservations
      water: Water
      toilets: Toilets
      season: Season
      fee_usd: Fee USD
      nearby: Nearby Trails
      summary: Summary
      description: Description
    required: [slug, name, region, sites, elevation_m, reservations, water, toilets, season, fee_usd, summary, description]
    collections:
      - template: templates/campgrounds.md.php
        output: campgrounds/index.md
