version: 1
datasets:
  customers:
    source: data/customers.csv
    template: templates/customer.md.php
    output: customers/{customer_id}.md
    key: customer_id
    columns:
      index: Index
      customer_id: Customer Id
      first_name: First Name
      last_name: Last Name
      company: Company
      city: City
      country: Country
      phone_primary: Phone 1
      phone_secondary: Phone 2
      email: Email
      subscription_date: Subscription Date
      website: Website
    required: [customer_id, first_name, last_name, company, city, country, email, subscription_date]
    collections:
      - template: templates/customers.md.php
        output: customers/index.md
  organizations:
    source: data/organizations.csv
    template: templates/organization.md.php
    output: organizations/{organization_id}.md
    key: organization_id
    columns:
      index: Index
      organization_id: Organization Id
      name: Name
      website: Website
      country: Country
      description: Description
      founded: Founded
      industry: Industry
      employees: Number of employees
    required: [organization_id, name, country, description, founded, industry, employees]
    collections:
      - template: templates/organizations.md.php
        output: organizations/index.md
