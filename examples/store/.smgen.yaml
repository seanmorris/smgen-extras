PRODUCT_NAME: Fernway Goods
TAGLINE: Paper, pens, and desk goods made to be used
TITLE_PREFIX: Fernway Goods
DEFAULT_THEME: theme-store
BASE_URL: http://localhost:8200/examples/store
OUTPUT_DIR: ../../static/examples/store
PAGES_DIR: ./pages
TEMPLATE_DIR: ./templates
STATIC_DIR: ./static
STYLES: [/scrollbar.css, /shop.css]
CORE_ASSETS:
  - main.js
  - nav-state.js
  - scrollbar.css
SCRIPTS:
  - /nav-state.js
DEFER_SCRIPTS:
  - /main.js
SEARCH_ENABLED: 0
SMGEN_ENGINE: php
PLUGINS:
  - use: smgen-data-pages
    options:
      config: .smgen-data-pages.yaml
    watch:
      - .smgen-data-pages.yaml
      - data
      - templates
  - use: smgen-categories
    options:
      config: .smgen-categories.yaml
    watch:
      - .smgen-categories.yaml
      - templates
  - smgen-store
