PRODUCT_NAME: Kestrel
TITLE_PREFIX: Kestrel
TAGLINE: Backups you can read
BASE_URL: ''
OUTPUT_DIR: ./docs

DEFAULT_THEME: theme-docs
PAGES_DIR: ./pages
TEMPLATE_DIR: ./templates
STATIC_DIR: ./static
SMGEN_ENGINE: php
SEARCH_ENABLED: auto
INHERIT_CORE_STATIC: 0
HIGHLIGHT_STYLE: kate
DOCS_VERSION: v2.4.0
DOCS_REPOSITORY: https://github.com/seanmorris/smgen-extras/tree/main/themes/docs
CORE_ASSETS:
  - main.js
  - nav-state.js
  - scrollbar.css
  - search.js
SCRIPTS:
  - /theme.js
  - /nav-state.js
DEFER_SCRIPTS:
  - /main.js
  - /search.js
STYLES:
  - /scrollbar.css
  - /docs.css
MENUS:
  docs:
    label: Contents
    renderer: tree
    hierarchy: source
    showLabel: false
MENU_REGIONS:
  sidebar: [docs]
